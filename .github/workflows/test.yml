name: Test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: python -m pytest -q -p no:cacheprovider

  platforms:
    # Real OpenClaw + Claude Code CLIs: skill loads, migrate output passes `openclaw config validate`,
    # plugin passes `claude plugin validate --strict` and installs from the marketplace.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g openclaw @anthropic-ai/claude-code
      - run: pip install pytest
      - run: python -m pytest -q -p no:cacheprovider tests/test_integration_platforms.py -rs
